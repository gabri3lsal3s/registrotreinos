<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="favZincBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#18181b"/>
      <stop offset="100%" stop-color="#09090b"/>
    </linearGradient>
    <linearGradient id="favEmerald" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="50%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="favMetal" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#e4e4e7"/>
      <stop offset="100%" stop-color="#71717a"/>
    </linearGradient>
  </defs>

  <!-- Squircle Base -->
  <rect width="128" height="128" rx="32" fill="url(#favZincBg)"/>
  <rect x="2" y="2" width="124" height="124" rx="30" fill="none" stroke="#10b981" stroke-width="2" stroke-opacity="0.4"/>

  <!-- Dumbbell Minimalist -->
  <g transform="translate(0, 0)">
    <!-- Bar Shaft -->
    <rect x="32" y="58" width="64" height="12" rx="6" fill="url(#favMetal)"/>

    <!-- Left Plates -->
    <rect x="14" y="44" width="8" height="40" rx="4" fill="url(#favEmerald)"/>
    <rect x="24" y="32" width="10" height="64" rx="5" fill="url(#favEmerald)"/>
    <rect x="36" y="54" width="4" height="20" rx="2" fill="url(#favMetal)"/>

    <!-- Right Plates -->
    <rect x="88" y="54" width="4" height="20" rx="2" fill="url(#favMetal)"/>
    <rect x="94" y="32" width="10" height="64" rx="5" fill="url(#favEmerald)"/>
    <rect x="106" y="44" width="8" height="40" rx="4" fill="url(#favEmerald)"/>
  </g>
</svg>